<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basket Lover</title>
<meta name="description" content="App para entrenadores de baloncesto: entrenamientos, pizarra, scouting y estadística en directo.">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E141A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Basket Lover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
button{touch-action:manipulation}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: app de una columna pensada para móvil a pie de pista; cabecera fija arriba, pestañas abajo, hojas que suben desde abajo */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F5F7F9; --line:#D8DEE5; --ink:#141E28; --muted:#5A6876;
  --accent:#D4561A; --accent-soft:#FBE7DC; --on-accent:#FFFFFF;
  --blue:#2358A3; --blue-soft:#E1EAF7;
  --ok:#24835A; --ok-soft:#DFF1E8; --warn:#A86F08; --warn-soft:#F7EDD6; --bad:#BE3B33; --bad-soft:#F8E0DE;
  --court:#E8C893; --court-paint:#DDB377; --court-line:#5A3818; --board-ink:#1B2733; --cone:#E39A12; --ball:#E0782C; --ball-seam:#5A2A0C;
  --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.07);
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2731; --line:#2A3744; --ink:#E6ECF2; --muted:#93A2B1;
  --accent:#F0793A; --accent-soft:#3A2418; --on-accent:#FFFFFF;
  --blue:#7CA5E8; --blue-soft:#1B2A40;
  --ok:#55C28C; --ok-soft:#173326; --warn:#E3AE4A; --warn-soft:#352914; --bad:#EE7066; --bad-soft:#3A1C1A;
  --court:#3B2D1F; --court-paint:#4A3826; --court-line:#E9D3AE; --board-ink:#F4EAD9; --cone:#F0B23C; --ball:#E8873C; --ball-seam:#3A1A06;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#161F28; --surface-2:#1C2731; --line:#2A3744; --ink:#E6ECF2; --muted:#93A2B1;
  --accent:#F0793A; --accent-soft:#3A2418; --on-accent:#FFFFFF;
  --blue:#7CA5E8; --blue-soft:#1B2A40;
  --ok:#55C28C; --ok-soft:#173326; --warn:#E3AE4A; --warn-soft:#352914; --bad:#EE7066; --bad-soft:#3A1C1A;
  --court:#3B2D1F; --court-paint:#4A3826; --court-line:#E9D3AE; --board-ink:#F4EAD9; --cone:#F0B23C; --ball:#E8873C; --ball-seam:#3A1A06;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#app{max-width:640px;margin:0 auto}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:.01em;line-height:1}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0;margin-top:3px}
.mark{width:32px;height:32px;flex:none}
.top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
main{padding-block:16px 110px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{text-wrap:balance;margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;letter-spacing:.005em}
h2{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.1}
h3{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.15}
p{margin:0}
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sec{margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.card.loop{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 70%)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;line-height:1.1;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn-p{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-p:hover{filter:brightness(1.05);border-color:var(--accent)}
.btn-b{background:var(--blue-soft);border-color:transparent;color:var(--blue)}
.btn-s{padding:6px 10px;font-size:13px}
.btn-danger{color:var(--bad)}
.btn-ghost{background:transparent;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag{display:inline-block;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--muted);white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pendiente{background:var(--surface-2);color:var(--muted)}
.st-progreso{background:var(--warn-soft);color:var(--warn)}
.st-conseguido{background:var(--ok-soft);color:var(--ok)}
.st-no{background:var(--bad-soft);color:var(--bad)}
.p-match{background:var(--accent-soft);color:var(--accent)}
.p-train{background:var(--blue-soft);color:var(--blue)}
.p-empty{background:var(--surface-2);color:var(--muted)}
.p-win{background:var(--ok-soft);color:var(--ok)}
.p-loss{background:var(--bad-soft);color:var(--bad)}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],input[type=email],input[type=password],select,textarea{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:15px;min-width:0}
textarea{resize:vertical;line-height:1.4}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:600;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.grid3>:first-child{grid-column:1/-1}}

/* Calendario */
.cal-head{display:flex;align-items:center;justify-content:space-between}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:600;color:var(--muted);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.cd{border:1px solid transparent;background:var(--surface-2);border-radius:9px;min-height:48px;padding:5px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.cd span{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.cd.out{background:transparent;opacity:.45}
.cd.today span{background:var(--accent);color:var(--on-accent);border-radius:999px;padding:3px 6px;margin-top:-3px}
.cd.sel{border-color:var(--ink);background:var(--surface)}
.dots{display:flex;gap:3px;font-style:normal}
.dot{width:7px;height:7px;border-radius:50%}
.dot.m{background:var(--accent)}
.dot.s{background:var(--blue)}
.dot.v{border:1.5px solid var(--blue)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;vertical-align:middle;margin-right:4px}
.ev{display:flex;gap:12px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.ev:hover{border-color:var(--muted)}
.ev .when{flex:none;width:46px;text-align:center;font-family:var(--f-display)}
.ev .when b{display:block;font-size:24px;line-height:1;font-weight:700}
.ev .when small{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-family:var(--f-body);font-weight:600}
.ev .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ev .what b{font-weight:600}
.ev .what .chips{gap:4px}
.ev.virtual{border-style:dashed;background:transparent}
.stack{display:flex;flex-direction:column;gap:8px}
.big-date{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;text-transform:capitalize}
.remind{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.remind svg{flex:none;width:18px;height:18px;color:var(--accent);margin-top:1px}
.remind .rb{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.quote{font-style:italic}

/* Sesión */
.bar{height:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:999px}
.bar.over i{background:var(--bad)}
.bar.full i{background:var(--ok)}
.block{border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.block-h{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.block-h b{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:.01em}
.items{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px 8px 12px;border-bottom:1px solid var(--line)}
.item-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.item-main b{font-weight:600;font-size:14.5px;line-height:1.25}
.item-main select{padding:4px 8px;font-size:12.5px;border-radius:8px;width:auto;max-width:100%}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;flex:none}
.stepper button{border:0;background:var(--surface-2);width:30px;height:32px;font-weight:700;font-size:16px}
.stepper span{min-width:40px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:14px}
.x{border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:8px;font-size:18px;flex:none}
.x:hover{background:var(--surface-2);color:var(--bad)}
.add-row{padding:8px 12px}
.picker{border-top:1px solid var(--line);background:var(--surface-2);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.pick-list{display:flex;flex-direction:column;gap:4px;max-height:270px;overflow-y:auto}
.pick{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 10px;width:100%}
.pick:hover{border-color:var(--blue)}
.pick .nm{flex:1;min-width:0}
.pick .nm b{display:block;font-weight:600;font-size:14px}
.star{color:var(--cone)}
.quick{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.sheet-foot{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin:0 -16px -16px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

/* Biblioteca */
.ex-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:380px){.ex-grid{grid-template-columns:1fr}}
.ex{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:14px;overflow:hidden;text-align:left;display:flex;flex-direction:column;padding:0;box-shadow:var(--shadow)}
.ex:hover{border-color:var(--muted)}
.ex .thumb{display:block;width:100%;height:auto;aspect-ratio:500/470;max-width:100%}
.ex .body{padding:9px 11px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.ex .body b{font-weight:600;font-size:14.5px;line-height:1.25}
.fav{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:999px;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.fav svg{width:18px;height:18px}
.fav.on svg{fill:var(--cone);stroke:var(--cone)}
.ex-detail .thumb{width:100%;max-width:100%;border-radius:12px;border:1px solid var(--line)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fact{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.fact small{display:block;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fact b{font-weight:600;font-size:14px}

/* Objetivos */
.season{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.sm{border:1px solid transparent;background:var(--surface);border-radius:9px;padding:6px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0}
.sm span{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.sm.sel{border-color:var(--ink)}
.sm.now span{color:var(--accent)}
.sm .segs{display:flex;flex-direction:column;gap:2px;width:60%}
.sm .segs i{height:4px;border-radius:2px;background:var(--line)}
.sm .segs i.conseguido{background:var(--ok)}.sm .segs i.progreso{background:var(--warn)}.sm .segs i.no{background:var(--bad)}.sm .segs i.pendiente{background:var(--muted);opacity:.35}
.obj{gap:8px}
.obj .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.obj .meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.origin{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent);font-weight:600}
.origin svg{width:14px;height:14px}
.st-select{width:auto;border-radius:999px;padding:5px 10px;font-size:13px;font-weight:600;border:0}
.month-nav{display:flex;align-items:center;gap:8px}
.month-nav b{font-family:var(--f-display);font-size:22px;font-weight:600;text-transform:capitalize;min-width:9ch;text-align:center}
.banner{border-radius:12px;padding:10px 12px;background:var(--warn-soft);color:var(--ink);font-size:14px}

/* Pizarra */
.tools{display:flex;gap:6px}
.tool{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:11px;width:62px;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:600}
.tool svg{width:22px;height:22px}
.tool.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted);min-height:1.4em}
.board-wrap{border-radius:14px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);max-width:560px;width:100%;align-self:center}
#board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.steps .count{font-weight:600;font-variant-numeric:tabular-nums;min-width:86px;text-align:center}
.edit-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--blue-soft);color:var(--blue);border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
.plays{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:460px){.plays{grid-template-columns:repeat(2,minmax(0,1fr))}}

.b-court{fill:var(--court)}
.b-paint{fill:var(--court-paint)}
.b-lines *{fill:none;stroke:var(--court-line);stroke-width:3}
.b-hoop{fill:none;stroke:var(--accent);stroke-width:3.5}
.b-arw line,.b-arw polyline{fill:none;stroke:var(--board-ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.b-arw .b-dash{stroke-dasharray:9 7}
.b-arw .b-bar{stroke-width:5}
.b-head{fill:var(--board-ink)}
.b-prev{opacity:.55}
.tk-a{fill:var(--accent);stroke:var(--court);stroke-width:2.5}
.tk-t{fill:var(--on-accent);font:700 17px var(--f-display);text-anchor:middle}
.tk-hit{fill:transparent}
.tk-d{stroke:var(--board-ink);stroke-width:4;stroke-linecap:round;fill:none}
.tk-dn{fill:var(--board-ink);font:700 14px var(--f-display)}
.tk-b{fill:var(--ball);stroke:var(--ball-seam);stroke-width:1.5}
.tk-bs{stroke:var(--ball-seam);stroke-width:1.2;fill:none}
.tk-c{fill:var(--cone);stroke:var(--board-ink);stroke-width:1}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;color:var(--muted);text-decoration:none;font-size:11.5px;font-weight:600}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--accent);background:var(--accent-soft)}

/* Hoja */
#sheet-root{position:fixed;inset:0;z-index:60}
.sheet-bg{position:absolute;inset:0;background:rgba(10,16,22,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
.sheet-in{display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
.empty{border:1px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.toggle{display:flex;gap:10px;align-items:flex-start;font-size:14px}

.cu-cell{width:38px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:18px;line-height:1;color:var(--on-accent)}
.cu-cell.on{background:var(--accent);border-color:var(--accent)}
.cu-cell.free{border-style:dashed}
.cu-cell.free.on{background:var(--blue);border-color:var(--blue)}
.cu-star{border:0;background:transparent;font-size:18px;color:var(--line);width:30px;height:30px}
.cu-star.on{color:var(--cone)}
.cu-msg{border-radius:10px;padding:8px 12px;font-size:13.5px;display:flex;flex-direction:column;gap:3px}
.cu-msg.bad{background:var(--bad-soft);color:var(--bad)}
.cu-msg.warn{background:var(--warn-soft);color:var(--warn)}
.cu-msg.ok{background:var(--ok-soft);color:var(--ok)}
.cu-cell.na{background:transparent;border-style:dashed;color:var(--muted);opacity:.55;font-size:13px}
.cu-cell.deny{animation:shake .45s;border-color:var(--bad);background:var(--bad-soft);color:var(--bad);opacity:1}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.cu-cell.deny{animation:none}}
[aria-disabled="true"].btn-p{opacity:.6}
.cu-why{border:1.5px solid var(--blue);border-radius:12px;padding:10px;display:grid;gap:6px;background:var(--surface)}
.sync-dot{border:0;cursor:pointer;font:inherit;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--good-soft,#e3f4ea);color:var(--good,#1d7a46);white-space:nowrap}
.sync-dot.saving,.sync-dot.wait{background:var(--surface-2,#eef1f4);color:var(--muted)}
.sync-dot.off{background:var(--bad-soft);color:var(--bad)}.sync-dot.ro{background:var(--surface-2,#eef1f4);color:var(--muted)}
@media (max-width:520px){.sync-dot span{display:none}.sync-dot{padding:4px 8px;font-size:14px}}
#sb-gate{position:fixed;inset:0;z-index:80;background:var(--bg);overflow:auto}
.sbg{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.sbg-card{width:100%;max-width:380px;display:grid;gap:10px}
.sbg-card h2{margin:6px 0 0;font-size:22px}.sbg-card .btn{width:100%;justify-content:center}
.sbg-brand{display:flex;align-items:center;gap:10px;font-size:20px}.sbg-brand .mark{width:36px;height:36px}
.team-share{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px}
.rv{gap:10px}.rv-cat{display:grid;gap:6px;padding:10px;border-radius:10px;background:var(--surface-2,rgba(127,127,127,.06));border-left:3px solid var(--blue)}
.rv-ok{border-left-color:var(--good,#1d7a46)}.rv-def{border-left-color:var(--warn,#b7791f)}.rv-dmg{border-left-color:var(--bad)}
.rv-h{display:flex;justify-content:space-between;align-items:baseline}.rv-note{display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap;font-size:14px}
.rv-txt{flex:1;min-width:140px}.rv-t{border:1px solid var(--line);background:var(--card,transparent);color:inherit;border-radius:6px;padding:1px 6px;font-size:12px;cursor:pointer}
.rv-acts{display:flex;gap:2px}.rv-add{display:flex;gap:6px;flex-wrap:wrap}.rv-add input{flex:1;min-width:160px}
.fi-list{display:grid;gap:2px;max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px}.fi-row{display:grid;grid-template-columns:3em 1fr auto auto;gap:8px;font-size:13.5px;align-items:baseline}
.scf td,.scf th{white-space:nowrap}.scf-x{border:0;background:none;color:inherit;cursor:pointer;padding:0 0 0 6px;font-size:14px}
.rv-link{display:grid;gap:6px;padding:10px;border:1.5px dashed var(--accent);border-radius:10px}.rv-link select{flex:1;min-width:0}
.rv-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface,transparent)}.rv-row .num{white-space:nowrap}.rv-row .good{color:var(--good,#1d7a46)}.rv-row .bad{color:var(--bad)}

<script>
/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
let _id=Date.now();const uid=()=>(_id++).toString(36);
const WD=['dom','lun','mar','mié','jue','vie','sáb'];
const WDL=['L','M','X','J','V','S','D'];
const WDN=['lunes','martes','miércoles','jueves','viernes','sábado','domingo'];
const MS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const ML=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const dow=s=>(parse(s).getDay()+6)%7; // 0 = lunes
const monthKey=s=>s.slice(0,7);
const addMonths=(mk,n)=>{let[y,m]=mk.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')};
const monthName=mk=>ML[+mk.slice(5)-1];
const monthLabel=mk=>monthName(mk)+' '+mk.slice(0,4);
const fmtDay=s=>{const d=parse(s);return WD[d.getDay()]+' '+d.getDate()+' '+MS[d.getMonth()]};
const TODAY=iso(new Date());
const relDay=s=>s===TODAY?'Hoy':s===addDays(TODAY,1)?'Mañana':s===addDays(TODAY,-1)?'Ayer':fmtDay(s);
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const daysLeftInMonth=s=>{const d=parse(s);return new Date(d.getFullYear(),d.getMonth()+1,0).getDate()-d.getDate()};

const BLOCKS=['Calentamiento','Técnica','Táctica','Juego','Vuelta a la calma'];
const TAGS=['calentamiento','bote','pase','tiro','tiro libre','defensa','rebote','presión','transición','táctica','juego','vuelta a la calma'];
const STATUS={pendiente:'Pendiente',progreso:'En progreso',conseguido:'Conseguido',no:'No conseguido'};
const PLAY_KINDS=['Sistema','Saque de banda','Saque de fondo','Defensa','Presión'];

/* Palabras de la nota del partido -> etiquetas de ejercicios y objetivo sugerido */
const KW=[
  [/presi[oó]n|p[eé]rdidas|perdemos (muchos )?balones|balones perdidos|perdemos el bal[oó]n/i,['presión','bote','pase'],'Superar la presión sin perder balones'],
  [/rebote/i,['rebote'],'Cerrar el rebote defensivo'],
  [/tiros? libres?/i,['tiro libre'],'Mejorar el porcentaje de tiros libres'],
  [/contraataque|transici|correr|balance/i,['transición'],'Mejorar la transición'],
  [/defens|penetra|1x1|uno contra uno|nos anotan|nos meten/i,['defensa'],'Defensa individual: frenar el 1x1'],
  [/zona/i,['táctica','pase'],'Ataque contra defensa en zona'],
  [/tir|acierto|anot|porcentaje|fallamos/i,['tiro'],'Mejorar la selección y el acierto de tiro'],
  [/pase|pasar/i,['pase'],'Pase: precisión y lectura'],
];
function analyzeNote(note){const tags=new Set();let title='';for(const[re,t,ti] of KW){if(re.test(note)){t.forEach(x=>tags.add(x));if(!title)title=ti}}
  if(!title&&note.trim())title='Corregir: '+note.trim().replace(/\s+/g,' ').slice(0,60);return{tags:[...tags],title}}

/* ---------- pizarra: datos ---------- */
const T=(id,k,n,x,y)=>({id,k,n,x,y});
function mkArrow(f,type,fromId,x2,y2,toId){const s=f.tokens.find(t=>t.id===fromId);let ex=x2,ey=y2;if(toId){const t=f.tokens.find(t=>t.id===toId);ex=t.x;ey=t.y}
  return{id:uid(),type,from:fromId,to:toId||null,x1:s.x,y1:s.y,x2:ex,y2:ey}}
const FULL=b=>({...b,court:'full'});
function BD(tokens,arrows){const f={tokens,arrows:[]};f.arrows=(arrows||[]).map(a=>mkArrow(f,...a));return{frames:[f]}}
function nearBall(tokens,p,r=32){let best=null,bd=r;for(const t of tokens){if(t.k!=='b')continue;const d=Math.hypot(t.x-p.x,t.y-p.y);if(d<bd){bd=d;best=t}}return best}
function nextFrame(f){
  const toks=f.tokens.map(t=>({...t}));const get=id=>toks.find(t=>t.id===id);const orig=id=>f.tokens.find(t=>t.id===id);
  for(const a of f.arrows){
    const src=a.from&&orig(a.from);
    if(a.type==='pase'){const b=nearBall(f.tokens,src||{x:a.x1,y:a.y1});if(b){const nb=get(b.id);nb.x=Math.round(a.x2+11);nb.y=Math.round(a.y2-11)}}
    else if(src){const nt=get(src.id);nt.x=Math.round(a.x2);nt.y=Math.round(a.y2);
      if(a.type==='bote'){const b=nearBall(f.tokens,src);if(b){const nb=get(b.id);nb.x=Math.round(a.x2+11);nb.y=Math.round(a.y2-11)}}}
  }
  // si un pase va a alguien que también se mueve, el balón le sigue
  for(const a of f.arrows){if(a.type==='pase'&&a.to){const rec=get(a.to);const b=toks.find(t=>t.k==='b'&&Math.hypot(t.x-(a.x2+11),t.y-(a.y2-11))<2);if(rec&&b){b.x=rec.x+11;b.y=rec.y-11}}}
  return{tokens:toks,arrows:[]};
}
function pickRollPlay(){
  const b=BD([T('a1','a',1,250,330),T('b1','b','',261,319),T('a5','a',5,335,205),T('a2','a',2,70,250),T('a3','a',3,430,250),T('a4','a',4,55,50),
    T('d1','d',1,250,290),T('d5','d',5,320,170)],[['bloqueo','a5',282,318]]);
  let f1=nextFrame(b.frames[0]);f1.arrows=[mkArrow(f1,'bote','a1',370,225),mkArrow(f1,'corte','a5',250,110),mkArrow(f1,'corte','a2',40,140)];
  let f2=nextFrame(f1);f2.arrows=[mkArrow(f2,'pase','a1',0,0,'a5')];
  let f3=nextFrame(f2);b.frames.push(f1,f2,f3);return b;
}
function boxPlay(){
  const b=BD([T('a1','a',1,250,14),T('b1','b','',261,4),T('a2','a',2,195,75),T('a3','a',3,305,75),T('a4','a',4,195,160),T('a5','a',5,305,160)],
    [['bloqueo','a4',205,95],['corte','a2',110,300],['corte','a3',420,210]]);
  let f1=nextFrame(b.frames[0]);f1.arrows=[mkArrow(f1,'pase','a1',0,0,'a2'),mkArrow(f1,'corte','a4',250,60)];
  let f2=nextFrame(f1);b.frames.push(f1,f2);return b;
}

/* ---------- datos de ejemplo ---------- */
function seedBase(){
  const w=dow(TODAY);const back=((w-5+7)%7)||7;const sat0=addDays(TODAY,-back);
  const cur=monthKey(TODAY),nxt=addMonths(cur,1),prv=addMonths(cur,-1);
  const exercises=[
    {id:'e1',name:'Rueda de bote con mano débil',desc:'Tres filas. Bote en carrera hasta el cono solo con la mano débil, cambio por detrás y vuelta con la fuerte.',minutes:15,players:'6-12',material:'1 balón por jugador, 3 conos',tags:['bote'],fav:true,
      board:BD([T('a1','a',1,110,430),T('b1','b','',121,419),T('a2','a',2,250,430),T('b2','b','',261,419),T('a3','a',3,390,430),T('b3','b','',401,419),T('c1','c','',110,230),T('c2','c','',250,230),T('c3','c','',390,230)],[['bote','a1',110,255],['bote','a2',250,255],['bote','a3',390,255]])},
    {id:'e2',name:'Bote contra presión 2x1',desc:'El atacante sube el balón contra dos defensores que le encierran. Objetivo: proteger el balón y salir del trap con un cambio de ritmo.',minutes:12,players:'3-9',material:'Balones, petos',tags:['bote','presión'],fav:true,
      board:BD([T('a1','a',1,250,430),T('b1','b','',261,419),T('d1','d',1,215,375),T('d2','d',2,290,375)],[['bote','a1',350,250]])},
    {id:'e3',name:'Pase y corte 3x0',desc:'Pasa a un ala y corta hacia el aro. Reponer la posición del que corta. Trabajar pase de pecho y picado con la mano exterior.',minutes:10,players:'3-12',material:'1 balón por trío',tags:['pase','táctica'],fav:false,
      board:BD([T('a1','a',1,250,310),T('b1','b','',261,299),T('a2','a',2,80,230),T('a3','a',3,420,230)],[['pase','a1',0,0,'a2'],['corte','a1',270,85]])},
    {id:'e4',name:'Salida de presión 4x4 a toda pista',desc:'Saque de fondo contra presión a toda pista. Prohibido botar hasta superar el primer defensor. Puntúa cruzar medio campo en 8 segundos.',minutes:15,players:'8',material:'Balón, petos',tags:['presión','pase','táctica'],fav:true,
      board:FULL(BD([T('a1','a',1,250,926),T('b1','b','',261,915),T('a2','a',2,110,830),T('a3','a',3,390,830),T('a4','a',4,250,690),T('d1','d',1,250,885),T('d2','d',2,135,800),T('d3','d',3,365,800),T('d4','d',4,250,650)],[['pase','a1',0,0,'a2'],['corte','a4',390,560]]))},
    {id:'e5',name:'Tiro tras bote: 5 puntos',desc:'Cinco posiciones alrededor de la zona. Bote de un paso hacia el cono y tiro. Cuenta canastas por posición.',minutes:12,players:'2-12',material:'5 conos, balones',tags:['tiro'],fav:false,
      board:BD([T('c1','c','',70,100),T('c2','c','',140,220),T('c3','c','',250,270),T('c4','c','',360,220),T('c5','c','',430,100),T('a1','a',1,250,390),T('b1','b','',261,379)],[['bote','a1',250,295]])},
    {id:'e6',name:'Tiros libres con fatiga',desc:'Por parejas: sprint de ida y vuelta y dos tiros libres. Anota el porcentaje de cada jugador.',minutes:10,players:'2-12',material:'Balones, hoja de registro',tags:['tiro libre','tiro'],fav:true,
      board:BD([T('a1','a',1,250,205),T('b1','b','',261,194),T('a2','a',2,195,120),T('a3','a',3,305,120)],[])},
    {id:'e7',name:'Defensa 1x1 desde el ala',desc:'El defensor recibe al atacante en el ala. Posición básica, orientar hacia la línea de fondo y cerrar el rebote al tiro.',minutes:15,players:'2-12',material:'Balones',tags:['defensa'],fav:true,
      board:BD([T('a1','a',1,85,260),T('b1','b','',96,249),T('d1','d',1,118,235)],[['bote','a1',165,85]])},
    {id:'e8',name:'Cierre de rebote 2x2',desc:'El entrenador tira. Los defensores hacen contacto y bloquean antes de ir al balón. Punto para la defensa por rebote cogido.',minutes:15,players:'4-8',material:'Balón',tags:['rebote','defensa'],fav:false,
      board:BD([T('a1','a',1,150,285),T('a2','a',2,350,285),T('d1','d',1,170,245),T('d2','d',2,330,245)],[['corte','a1',205,110],['corte','a2',295,110]])},
    {id:'e9',name:'Contraataque 3x2 + 2x1',desc:'Tres atacan contra dos. Quien coge el rebote o recibe la canasta sale con el balón en 2x1 hacia el otro lado.',minutes:15,players:'5-10',material:'Balones',tags:['transición'],fav:true,
      board:FULL(BD([T('a1','a',1,250,720),T('b1','b','',261,709),T('a2','a',2,80,740),T('a3','a',3,420,740),T('d1','d',1,250,330),T('d2','d',2,250,170)],[['bote','a1',250,520],['corte','a2',70,250],['corte','a3',430,250]]))},
    {id:'e10',name:'Mikan',desc:'Bandejas alternas bajo el aro sin que el balón toque el suelo. Por series de 30 segundos.',minutes:8,players:'1-12',material:'Balón',tags:['calentamiento','tiro'],fav:false,
      board:BD([T('a1','a',1,210,75),T('b1','b','',221,64)],[['corte','a1',292,75]])},

const P2=(x,y)=>x.toFixed(1)+','+y.toFixed(1);
function arrowSVG(a,extra=''){
  const L=Math.hypot(a.x2-a.x1,a.y2-a.y1);if(L<4)return'';
  const ux=(a.x2-a.x1)/L,uy=(a.y2-a.y1)/L,nx=-uy,ny=ux;
  const s0=a.from?17:0,e0=a.to?18:0,len=L-s0-e0;if(len<8)return'';
  const sx=a.x1+ux*s0,sy=a.y1+uy*s0,ex=a.x2-ux*e0,ey=a.y2-uy*e0;
  if(a.type==='bloqueo')return `<g class="b-arw ${extra}"><line x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${ex.toFixed(1)}" y2="${ey.toFixed(1)}"/><line class="b-bar" x1="${(ex+nx*13).toFixed(1)}" y1="${(ey+ny*13).toFixed(1)}" x2="${(ex-nx*13).toFixed(1)}" y2="${(ey-ny*13).toFixed(1)}"/></g>`;
  const hx=ex-ux*13,hy=ey-uy*13;const head=`<polygon class="b-head" points="${P2(ex,ey)} ${P2(hx+nx*7,hy+ny*7)} ${P2(hx-nx*7,hy-ny*7)}"/>`;
  let body;
  if(a.type==='bote'){const zl=Math.max(0,len-13),n=Math.max(2,Math.round(zl/11)),pts=[P2(sx,sy)];
    for(let i=1;i<n;i++){const t=i/n*zl,s=(i%2?1:-1)*6;pts.push(P2(sx+ux*t+nx*s,sy+uy*t+ny*s))}pts.push(P2(hx,hy));body=`<polyline points="${pts.join(' ')}"/>`}
  else body=`<line${a.type==='pase'?' class="b-dash"':''} x1="${sx.toFixed(1)}" y1="${sy.toFixed(1)}" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}"/>`;
  return `<g class="b-arw ${extra}">${body}${head}</g>`;
}

function newDraft(date,from,occ){if(!occ){const t=dayTrainings(date).find(x=>!x.s&&x.occ);occ=t?t.occ:null}const base={id:null,date,time:occ?occ.start:'18:00',duration:occ?durOf(occ.start,occ.end):90,type:occ?occ.type:'Pista',blocks:BLOCKS.map(n=>({name:n,items:[]}))};
  if(from){base.blocks=clone(from.blocks).map(b=>({...b,items:b.items.map(i=>({...i,id:uid()}))}));if(!occ){base.duration=from.duration;base.time=from.time}}return base}
function openSessionDraft(d){SD=d;if(!SD.att&&(S.roster||[]).length){SD.att={};S.roster.forEach(r=>SD.att[r.id]='p')}pickerFor=null;pickQ='';openSheet(sessionSheet,afterSession)}
ACT['new-session']=el=>{const d=el.dataset.d||nextFreeTraining()||TODAY;openSessionDraft(newDraft(d,null,el.dataset.k?occByKey(d,el.dataset.k):null))};

function afterSession(){const q=$('#pick-q');if(q&&pickerFor!=null&&document.activeElement!==q&&!pickQ)q.focus({preventScroll:true})}
function pickListHTML(){const q=pickQ.trim().toLowerCase();

  if(!list.length)return `<div class="empty">Ningún ejercicio coincide. Créalo desde Ejercicios.</div>`;
  return list.map(({e,u})=>`<button class="pick" data-act="pick-ex" data-id="${e.id}"><span class="star" aria-hidden="true">${e.fav?'★':'&nbsp;&nbsp;'}</span><span class="nm"><b>${esc(e.name)}</b><span class="small muted">${e.tags.join(' · ')}${u?` · usado ${u}×`:''}</span></span><span class="small muted num">${e.minutes}′</span></button>`).join('')}
function sessionSheet(){const s=SD;const total=sessTotal(s);const diff=s.duration-total;
  const mObjs=S.objectives.filter(o=>o.month===monthKey(s.date));
  const rems=activeReminders(s.date);
  const empty=s.blocks.every(b=>!b.items.length);
  const pct=Math.min(100,total/s.duration*100);
  let h=sheetHead(s.id?'Sesión de entrenamiento':'Nueva sesión',cap(fmtDay(s.date))+' · '+s.time);
  h+=`<div class="grid3"><label class="f">Fecha<input type="date" data-chg="sd-date" value="${s.date}"></label><label class="f">Hora<input type="time" data-chg="sd-time" value="${s.time}"></label>
  <label class="f">Duración<select data-chg="sd-dur">${[...new Set([30,45,60,75,90,105,120,s.duration])].sort((a,b)=>a-b).map(v=>`<option value="${v}" ${v==s.duration?'selected':''}>${v} min</option>`).join('')}</select></label></div>`;
  h+=attHTML();
  h+=rems.map(m=>{const an=analyzeNote(m.note);const sug=S.exercises.filter(e=>e.tags.some(t=>an.tags.includes(t))).sort((a,b)=>b.fav-a.fav).slice(0,3);
    return reminderBox(m,`${sug.length?`<div class="chips">${sug.map(e=>`<button class="chip" data-act="add-sug" data-id="${e.id}" data-m="${m.id}">+ ${esc(e.name)}</button>`).join('')}</div>`:''}<div><button class="btn btn-s" data-act="resolve-rem" data-m="${m.id}">Ya lo he trabajado</button></div>`)}).join('');
  if(empty){const prev=lastSessions(3,s.id?null:undefined).filter(x=>x.id!==s.id);
    h+=`<div class="quick"><b>Empieza rápido</b><div class="chips">${prev.map(p=>`<button class="chip" data-act="copy-from" data-id="${p.id}">Copiar la del ${fmtDay(p.date)}</button>`).join('')}${S.templates.map(t=>`<button class="chip" data-act="copy-tpl" data-id="${t.id}">Plantilla: ${esc(t.name)}</button>`).join('')}</div><span class="small muted">O añade ejercicios bloque a bloque.</span></div>`}
  h+=`<div class="stack" style="gap:6px"><div class="row between small"><b class="num">${total} de ${s.duration} min</b><span class="${diff<0?'':'muted'}" style="${diff<0?'color:var(--bad);font-weight:600':''}">${diff>0?`Quedan ${diff} min libres`:diff<0?`Te pasas ${-diff} min`:'Cuadra justo'}</span></div><div class="bar ${diff<0?'over':diff===0?'full':''}"><i style="width:${pct}%"></i></div></div>`;
  s.blocks.forEach((b,bi)=>{const sub=b.items.reduce((a,i)=>a+(+i.min||0),0);
    h+=`<div class="block"><div class="block-h"><b>${esc(b.name)}</b><span class="small muted num">${sub} min</span></div><div class="items">`;
    b.items.forEach((it,ii)=>{const e=exById(it.exId);const opts=[...mObjs];const lo=it.objId&&objById(it.objId);if(lo&&!opts.includes(lo))opts.push(lo);
      h+=`<div class="item"><div class="item-main"><b>${e?esc(e.name):'Ejercicio borrado'}</b><select data-chg="it-obj" data-b="${bi}" data-i="${ii}" aria-label="Objetivo">
      <option value="">Sin objetivo</option>${opts.map(o=>`<option value="${o.id}" ${o.id===it.objId?'selected':''}>🎯 ${esc(o.title)}</option>`).join('')}</select></div>
      <div class="stepper"><button data-act="it-min" data-b="${bi}" data-i="${ii}" data-d="-5" aria-label="Menos minutos">−</button><span>${it.min}′</span><button data-act="it-min" data-b="${bi}" data-i="${ii}" data-d="5" aria-label="Más minutos">+</button></div>
      <button class="x" data-act="it-rm" data-b="${bi}" data-i="${ii}" aria-label="Quitar">×</button></div>`});
    h+=`</div>${pickerFor===bi?`<div class="picker"><div class="row between"><b class="small">Añadir a ${esc(b.name).toLowerCase()}</b><button class="btn btn-ghost btn-s" data-act="pick-close">Cerrar</button></div><input type="search" id="pick-q" data-inp="pick-q" placeholder="Buscar ejercicio o etiqueta" value="${esc(pickQ)}"><div class="pick-list" id="pick-list">${pickListHTML()}</div></div>`
      :`<div class="add-row"><button class="btn btn-ghost btn-s" data-act="pick-open" data-b="${bi}" style="color:var(--blue)">+ Añadir ejercicio</button></div>`}</div>`});
  if(mObjs.length){h+=`<div class="stack" style="gap:6px"><div class="eyebrow">Objetivos de ${monthName(monthKey(s.date))} en esta sesión</div>${mObjs.map(o=>{const mm=s.blocks.reduce((a,b)=>a+b.items.filter(i=>i.objId===o.id).reduce((x,i)=>x+i.min,0),0);
    return `<div class="row between small"><span>${esc(o.title)}</span><b class="num" style="${mm?'':'color:var(--muted)'}">${mm} min</b></div>`}).join('')}</div>`}
  h+=`<div class="sheet-foot">${s.id?`<button class="btn btn-danger btn-ghost" data-act="sd-del">${SD._del?'¿Seguro? Eliminar':'Eliminar'}</button>`:''}${!empty?`<button class="btn" data-act="sd-tpl">Guardar como plantilla</button>`:''}<button class="btn btn-p" data-act="sd-save">Guardar sesión</button></div>`;
  return h}

function monthShare(list){const ss=S.sessions.filter(s=>monthKey(s.date)===objMonth&&s.date<TODAY);const total=ss.reduce((a,s)=>a+sessTotal(s),0);if(!total)return'';
  const sum=f=>ss.reduce((a,s)=>a+s.blocks.reduce((x,b)=>x+b.items.filter(f).reduce((y,i)=>y+(+i.min||0),0),0),0);
  const rows=list.map(o=>({o,m:sum(i=>i.objId===o.id)})).sort((a,b)=>b.m-a.m);const linked=rows.reduce((a,r)=>a+r.m,0);const free=sum(i=>!i.objId);
  const row=(label,m,cls)=>`<div class="share-row ${cls||''}"><div class="lbl"><span>${label}</span><b class="num">${m} min</b></div><div class="bar"><i style="width:${(m/total*100).toFixed(1)}%"></i></div></div>`;

function objCard(o){const st=objStats(o.id);const m=o.fromMatch&&matchById(o.fromMatch);

function suggestions(){const f=PZ.board.frames[0];const out=[];const notes=(PZ.notes.danger||'')+'\n'+(PZ.notes.defend||'');
  for(const t of f.tokens){if(t.k!=='a')continue;const r=roleOf(t.id);if(!r)continue;
    for(const tag of [...(r.fuertes||[]),...(r.debiles||[])])for(const[k,tx] of (SUG[tag]||[])){let text=fixArt(tx.replace('{n}',tokenRef(t)));text=text.charAt(0).toUpperCase()+text.slice(1);if(!notes.includes(text))out.push({k,text})}}
  return out}

function scoutText(r){const t=tplById(r.tplId);const has=k=>t.sections.includes(k);const m=r.matchId&&matchById(r.matchId);const L=[];
  L.push(`SCOUTING · ${r.rival||'Rival'}${m?` · ${fmtDay(m.date)} ${m.time} (${m.home?'en casa':'fuera'})`:''}`);
  const vtxt=c=>`${c.label||'Vídeo'}${c.min?' ('+c.min+')':''}: ${clipHref(c)}`;const rv=(r.clips||[]).filter(c=>clipHref(c));if(rv.length)L.push('','VÍDEO DEL RIVAL',...rv.map(vtxt));
  if(has('general')){const g=r.general;const x=[g.coach&&'Entrenador: '+g.coach,g.court&&'Pabellón: '+g.court,g.record&&'Balance: '+g.record,g.last&&'Último enfrentamiento: '+g.last].filter(Boolean);if(x.length)L.push('',...x)}
  if(has('estilo')){const e=r.estilo;const x=[e.ritmo&&'Ritmo: '+e.ritmo.toLowerCase(),e.defensas.length&&'Defensas: '+e.defensas.join(', '),e.ataque&&'Ataque: '+e.ataque,e.transicion&&'Transición: '+e.transicion].filter(Boolean);if(x.length)L.push('','ESTILO',...x)}
  if(has('jugadores')&&r.players.length){L.push('','JUGADORES');sortedPlayers(r).forEach(p=>{L.push(`#${p.dorsal||'?'} ${p.name||p.pos||''}${p.name&&p.pos?' ('+p.pos+')':''}${p.hand==='Zurdo'?', zurdo':''} ${'★'.repeat(p.danger||0)}`.replace(/\s+/g,' ').trim());
    const tg=[...p.fuertes,...p.debiles.map(d=>'débil: '+d.toLowerCase())];if(tg.length)L.push('   '+tg.join(' · '));if(p.howto)L.push('   → '+p.howto.replace(/\n/g,' '))})}
  if(has('jugadas')&&r.playIds.length){L.push('','JUGADAS');r.playIds.map(id=>S.plays.find(p=>p.id===id)).filter(Boolean).forEach(p=>{L.push(`• ${p.name} (${p.kind})`);if(p.notes&&p.notes.defend)L.push('   Cómo defenderla: '+p.notes.defend.replace(/\n/g,' '));(p.clips||[]).filter(c=>clipHref(c)).forEach(c=>L.push('   ▶ '+vtxt(c)))})}
  if(has('claves')){const a=r.claves.atq.filter(x=>x&&x.trim()),d=r.claves.def.filter(x=>x&&x.trim());if(a.length)L.push('','CLAVES EN ATAQUE',...a.map((x,i)=>`${i+1}. ${x}`));if(d.length)L.push('','CLAVES EN DEFENSA',...d.map((x,i)=>`${i+1}. ${x}`))}
  if(has('preguntas')){const x=t.questions.map(q=>[q,(r.answers||{})[qKey(q)]]).filter(([,a])=>a&&a.trim());if(x.length){L.push('','PREGUNTAS');x.forEach(([q,a])=>L.push(q,'   '+a.replace(/\n/g,' ')))}}
  if(has('notas')&&r.notas&&r.notas.trim())L.push('','NOTAS',r.notas.trim());
  return L.join('\n')}

const fn=(v,d=1)=>v==null||!isFinite(v)?'—':(+v).toFixed(d);
const valB=b=>bxPts(b)+reb(b)+b.as+b.rob+b.tap+b.fr-(fga(b)-fgm(b))-(b.tli-b.tla)-b.per-b.fc;

  m.stats={perd:T.per,rebO:T.ro,rebRO:O.ro,t3:T.t3a,tlA:T.tla,tlI:T.tli,faltas:T.fc};const a=bxPts(T),c=bxPts(O);if(a>0)m.us=a;if(c>0)m.them=c}
function addStatsSeed(o){let sd=11;const rnd=()=>{sd=(sd*9301+49297)%233280;return sd/233280};const ri=(a,b)=>a+Math.floor(rnd()*(b-a+1));
  const MINS={m1:[28,16,22,16,26,12,20,20,6,24,0,10],m2:[30,18,24,16,28,12,20,22,6,24,0,0],m3:[30,18,24,16,28,12,20,22,6,24,0,0]};

    o.roster.forEach((r,i)=>{const p=m.pts[r.id]||0,mn=mins[i];if(!mn&&!p)return;const big=['Ala-pívot','Pívot'].includes(r.pos),out=!big;
      let t3=0;if(out&&p>=6&&t3left>0){t3=Math.min(t3left,p>=12?2:1);t3left-=t3}
      let rem=p-3*t3;let ft=rem>=8?2:0;if((rem-ft)%2)ft++;const t2=(rem-ft)/2;
      m.box[r.id]={min:mn,t2a:t2,t2i:t2+ri(Math.ceil(t2*.5),t2+1),t3a:t3,t3i:t3+(out&&mn>15?ri(0,2):0)+(t3?ri(0,1):0),tla:ft,tli:ft+(ft?ri(0,2):(mn>20?ri(0,1):0)),
        ro:big?ri(1,4):ri(0,1),rd:big?ri(3,7):ri(0,3),as:r.pos==='Base'?ri(3,6):ri(0,2),rob:ri(0,2),tap:big?ri(0,2):0,per:ri(0,2),fc:ri(1,3),fr:ri(0,3),pm:mn?Math.round((m.us-m.them)*mn/40+ri(-4,4)):0}});
    const fit=(k,goal)=>{if(goal==null)return;const ids=Object.keys(m.box).sort((a,b)=>m.box[b].min-m.box[a].min);let cur=ids.reduce((a,id)=>a+m.box[id][k],0);let g=0;
      while(cur!==goal&&g<200){const id=ids[g%ids.length];if(cur<goal){m.box[id][k]++;cur++}else if(m.box[id][k]>0){m.box[id][k]--;cur--}g++}};
    fit('per',target.perd);fit('ro',target.rebO);fit('fc',target.faltas);

    syncFromBox(m)}
}

function vDrawCtx(ctx,shapes,W,H){const sx=W/VW,sy=H/VH,w=6*sx;ctx.lineCap='round';ctx.lineJoin='round';

  for(const s of shapes){if(s.k==='arrow'||s.k==='pass'){const x1=s.x1*sx,y1=s.y1*sy,x2=s.x2*sx,y2=s.y2*sy,L=Math.hypot(x2-x1,y2-y1)||1,ux=(x2-x1)/L,uy=(y2-y1)/L,hs=w*3.2,bx=x2-ux*w*2.6,by=y2-uy*w*2.6;

    else if(s.k==='free')stroke(()=>{s.pts.forEach((q,i)=>i?ctx.lineTo(q[0]*sx,q[1]*sy):ctx.moveTo(q[0]*sx,q[1]*sy))},s.c,w);

const fixedN=()=>CU.rules==='alevin'?5:CU.np; // periodos con reparto obligatorio
function cuadCheck(){const rows=cuadRows(),N=rows.length,al=CU.rules==='alevin',F=fixedN();const errs=[],warns=[],ok=[];
  for(let i=0;i<F;i++){const n=rows.filter(p=>cell(p.id,i)).length;if(n!==5)errs.push(`${i+1}.º ${al?'periodo':'cuarto'}: hay ${n} jugadores, tienen que ser 5`)}
  if(al){if(N<5)errs.push(`Solo hay ${N} convocados: no se puede jugar`);else if(N<9)warns.push(`Hay ${N} convocados (mínimo 9). El partido se juega y se informa en el acta.`);
    if(N>12)errs.push('Máximo 12 jugadores en acta');
    rows.forEach(p=>{const n=[0,1,2,3,4].filter(i=>cell(p.id,i)).length;if(n<2)errs.push(`#${p.dorsal} ${p.name}: juega ${n} de los 5 primeros periodos (mínimo 2)`);else if(n>3&&N>=9)errs.push(`#${p.dorsal} ${p.name}: juega ${n} de los 5 primeros periodos (máximo 3, y debe descansar 2)`);else if(n>3)warns.push(`#${p.dorsal} ${p.name}: juega ${n} periodos (con menos de 9 convocados no se puede cumplir el máximo de 3)`)});
    const s6=rows.filter(p=>cell(p.id,5)).length;if(s6>5)errs.push(`6.º periodo: has marcado ${s6} para empezar, como máximo 5`);
    if(!errs.length&&N>=9)ok.push('Cumple las normas de la FBM para alevines: 5 por periodo y cada jugador entre 2 y 3 de los 5 primeros periodos.')}
  else{const cnt=rows.map(p=>Array.from({length:CU.np},(_,i)=>cell(p.id,i)).filter(Boolean).length);if(cnt.length){const mn=Math.min(...cnt),mx=Math.max(...cnt);if(mx-mn>1)warns.push(`Reparto desigual: hay jugadores con ${mn} y otros con ${mx} ${CU.np===4?'cuartos':'periodos'}`)}
    if(!errs.length)ok.push(CU.rules==='benjamin'?'Benjamín: la FBM permite cambios libres (FIBA). Este cuadrante es solo tu plan de rotación.':'Plan de rotación sin normas obligatorias.')}
  return{errs,warns,ok}}
function cuadAuto(shuffle){const rows=cuadRows(),N=rows.length,F=fixedN();if(N<5){toast('Necesitas al menos 5 convocados');return}
  const slots=F*5;let base=Math.floor(slots/N),extra=slots-base*N;if(CU.rules==='alevin'&&N>=9){base=2;extra=slots-2*N}
  const order=rows.slice();if(shuffle)order.sort(()=>Math.random()-.5);
  const stars=order.filter(p=>CU.star.includes(p.id)),rest=order.filter(p=>!CU.star.includes(p.id));const pri=stars.concat(rest);
  const plays=new Map(rows.map(p=>[p.id,base]));for(let k=0;k<extra;k++)plays.set(pri[k%pri.length].id,plays.get(pri[k%pri.length].id)+1);
  const fill=Array(F).fill(0),grp=Array.from({length:F},()=>({}));const grid={};
  rows.forEach(p=>{grid[p.id]=Array(CU.np).fill(0);if(CU.grid[p.id]&&CU.np>F)grid[p.id][F]=CU.grid[p.id][F]||0});
  const seq=rows.slice().sort((a,b)=>plays.get(b.id)-plays.get(a.id)||(shuffle?Math.random()-.5:0));
  for(const p of seq){const g=posGroup(p.pos);const need=plays.get(p.id);const chosen=[];
    for(let k=0;k<need;k++){let best=-1,bs=1e9;for(let i=0;i<F;i++){if(chosen.includes(i)||fill[i]>=5)continue;
      const adj=chosen.some(c=>Math.abs(c-i)===1)?0.3:0;const sc=fill[i]*10+(g?(grp[i][g]||0)*2:0)+adj+(shuffle?Math.random()*0.5:0);if(sc<bs){bs=sc;best=i}}
      if(best<0)break;chosen.push(best);fill[best]++;if(g)grp[best][g]=(grp[best][g]||0)+1}
    chosen.forEach(i=>grid[p.id][i]=1)}
  CU.grid=grid;renderSheet();const c=cuadCheck();toast(c.errs.length?'Generado, pero revisa los avisos':'Cuadrante generado')}

  ${rows.length?`<div class="tbl-wrap"><table class="tb cuad"><thead><tr><th class="stk">Jugador</th><th title="Prioridad: juega más periodos al generar">★</th>${Array.from({length:CU.np},(_,i)=>`<th>${lab(i)}${al&&i===5?'<br><span class="muted">libre</span>':''}</th>`).join('')}<th>Juega</th></tr></thead><tbody>

function cuadAuto(shuffle){const rows=cuadRows(),N=rows.length,F=fixedN();if(N<5){toast('Necesitas al menos 5 convocados');return}

  let res=null;

    const stars=order.filter(p=>CU.star.includes(p.id)),rest=order.filter(p=>!CU.star.includes(p.id));const pri=stars.concat(rest);
    const plays=new Map(rows.map(p=>[p.id,base]));for(let k=0;k<extra;k++)plays.set(pri[k%pri.length].id,plays.get(pri[k%pri.length].id)+1);
    const fill=Array(F).fill(0),grp=Array.from({length:F},()=>({}));const grid={};let ok=true;
    rows.forEach(p=>{grid[p.id]=Array(CU.np).fill(0);if(CU.grid[p.id]&&CU.np>F)grid[p.id][F]=CU.grid[p.id][F]||0});
    const seq=rows.slice().sort((a,b)=>plays.get(b.id)-plays.get(a.id)||(rnd?Math.random()-.5:0));
    for(const p of seq){const g=posGroup(p.pos);const need=plays.get(p.id);const chosen=[];
      for(let k=0;k<need;k++){let best=-1,bs=1e9;for(let i=0;i<F;i++){if(chosen.includes(i)||fill[i]>=5)continue;
        if(al&&no3On()){const s=[0,1,2,3,4].map(j=>j===i||chosen.includes(j));if([0,1,2].some(x=>s[x]&&s[x+1]&&s[x+2]))continue}
        const adj=chosen.some(c=>Math.abs(c-i)===1)?0.3:0;const sc=fill[i]*10+(g?(grp[i][g]||0)*2:0)+adj+(rnd?Math.random()*0.8:0);if(sc<bs){bs=sc;best=i}}

function fbmLinesFromItems(items){const rows=[];for(const it of items){if(!it.str||!it.str.trim())continue;const y=Math.round(it.transform[5]);let r=rows.find(r=>Math.abs(r.y-y)<=2);if(!r){r={y,its:[]};rows.push(r)}r.its.push(it)}
  rows.sort((a,b)=>b.y-a.y);return rows.map(r=>r.its.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ').replace(/[­‐-―−]/g,'-').replace(/\s+/g,' ').trim())}
function fbmParse(lines){const out={title:'',teams:[]};let cur=null;
  for(let i=0;i<lines.length;i++){const L=lines[i];
    if(!out.title&&/^Estad[ií]sticas\b/i.test(L))out.title=L.replace(/^Estad[ií]sticas\s*-\s*/i,'');
    if(/^Entrenador\s*:/i.test(L)){cur={name:(lines[i-1]||'').trim(),coach:L.replace(/^Entrenador\s*:\s*/i,'').trim(),players:[],tot:null};out.teams.push(cur);continue}
    if(!cur)continue;
    const tm=/^TOTALES\s+(\d+:\d\d)\s+(-?\d+)\s+(\d+)\/(\d+)\s+-?\d+\s+(\d+)\/(\d+)\s+-?\d+\s+(\d+)\/(\d+)\s+-?\d+\s+((?:-?\d+\s+){11}-?\d+)/.exec(L);
    if(tm){const n=tm[9].trim().split(/\s+/).map(Number);cur.tot={pts:+tm[2],t2a:+tm[3],t2i:+tm[4],t3a:+tm[5],t3i:+tm[6],tla:+tm[7],tli:+tm[8],rd:n[0],ro:n[1],as:n[3],rob:n[4],per:n[5],tap:n[6],fc:n[8],fr:n[9]};continue}
    const m=/^(\d{1,3}|X)\s+(\*?)\s*(.+?)\s+(\d{1,3}):(\d\d)\s+(-?\d+)\s+(\d+)\/(\d+)\s+-?\d+\s+(\d+)\/(\d+)\s+-?\d+\s+(\d+)\/(\d+)\s+-?\d+\s+((?:-?\d+\s+){11}-?\d+)\s*$/.exec(L);
    if(m){const n=m[13].trim().split(/\s+/).map(Number);const sec=(+m[4])*60+(+m[5]);
      cur.players.push({dorsal:m[1],starter:!!m[2],cap:/\(CAP\)/i.test(m[3]),name:m[3].replace(/\(CAP\)/i,'').trim(),sec,min:Math.round(sec/60),pts:+m[6],t2a:+m[7],t2i:+m[8],t3a:+m[9],t3i:+m[10],tla:+m[11],tli:+m[12],rd:n[0],ro:n[1],as:n[3],rob:n[4],per:n[5],tap:n[6],fc:n[8],fr:n[9],val:n[10],pm:n[11]})}}
  return out}

const sbErr=e=>{const m=(e&&e.message)||'';if(/invalid login|invalid credentials/i.test(m))return 'Email o contraseña incorrectos';if(/already registered|already exists/i.test(m))return 'Ya hay una cuenta con ese email: pulsa «Ya tengo cuenta»';if(/password/i.test(m))return 'La contraseña tiene que tener al menos 6 caracteres';if(/email/i.test(m))return 'Revisa el email';if(/fetch|network/i.test(m))return 'No hay conexión. Prueba otra vez cuando tengas internet';return m||'No se ha podido. Prueba otra vez'};

async function sbEnsureSpaces(){if(!SB.cli||!SB.user||SBX.busy||!SY.ready||S_SEEDED||S._demo)return;SBX.busy=true;let made=0;

    if(made){await sbLoadSpaces();await sbSeedGlobals();await syPush();if(SY.db&&SY.db.refresh)await SY.db.refresh();if(SH&&SH.render===teamsSheet)renderSheet()}}

async function sbSeedGlobals(){const G=Object.entries(syDocs()).filter(([id])=>id.startsWith('g:')&&id!=='g:teams');
  for(const sp of SB.spaces){if(!sp.team)continue;const D=SB.RS[sp.id]||{};const miss=G.filter(([id])=>!D[id]);if(!miss.length)continue;
    const rows=miss.map(([id,body])=>({space:sp.id,id,body,updated_at:new Date().toISOString()}));for(let i=0;i<rows.length;i+=25){await SB.cli.from('bl_docs').upsert(rows.slice(i,i+25))}}}

   <div class="small muted">Estado: ${SY.st==='ok'?'todo subido':SY.st==='off'?'sin conexión (se subirá solo al volver)':SY.st==='saving'?'subiendo cambios…':'conectando…'}</div>

{const _st=ACT['settings'];ACT['settings']=(...a)=>{_st(...a);if(!SB.cli||!SH)return;const r=SH.render;SH.render=()=>{const h=r();
